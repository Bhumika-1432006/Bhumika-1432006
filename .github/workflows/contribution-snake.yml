name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/contribution_snake.py"
      - ".github/workflows/contribution-snake.yml"

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: Bhumika-1432006
        run: python3 .github/scripts/contribution_snake.py contribution-snake.svg

      - name: Commit contribution-snake.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contribution-snake.svg
          git diff --staged --quiet || git commit -m "Update contribution-snake.svg"
          git pull --rebase origin main
          git push
