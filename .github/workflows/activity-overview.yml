name: Generate Activity Overview

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/activity_overview.py"
      - ".github/workflows/activity-overview.yml"

jobs:
  overview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity overview SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: Bhumika-1432006
        run: python3 .github/scripts/activity_overview.py activity-overview.svg

      - name: Commit activity-overview.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity-overview.svg
          git diff --staged --quiet || git commit -m "Update activity-overview.svg"
          git push
